<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Junior Jovin - Full-Stack Engineer">
  <title>Junior Jovin — Full-Stack Engineer</title>
  <defs>
    <style><![CDATA[
      svg{--bg:#f3f6fb;--ink:#0b1220;--muted:#4c5b7a;--accent:#0891b2;--grid:rgba(9,30,66,.07);}
      .mono{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'DejaVu Sans Mono',monospace}
      .sans{font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',sans-serif}
      .name{font-size:64px;font-weight:800;letter-spacing:2px;fill:var(--ink)}
      .role{font-size:26px;fill:var(--muted)}
      .tag{font-size:16px;fill:var(--muted)}
    ]]></style>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="var(--grid)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="var(--bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <text class="sans name" x="80" y="150">JUNIOR JOVIN</text>
  <text class="sans role" x="80" y="198">Full-Stack Engineer</text>
  <line x1="82" y1="220" x2="352" y2="220" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
  <text class="mono tag" x="80" y="264">Fintech &middot; POS platforms &middot; Linux tooling — built end to end, shipped and maintained.</text>
  <rect x="0" y="316" width="1200" height="4" fill="var(--accent)"/>
</svg>