      svg{--bg0:#04060d;--bg1:#0a1022;--bg2:#080614;--ink:#e8eefc;--muted:#8ea0c4;--c1:#22d3ee;--c2:#8b5cf6;--c3:#f472b6;--panel:rgba(12,18,36,.72);--stroke:rgba(120,190,255,.18);--chip:rgba(120,190,255,.07);--chipStroke:rgba(120,190,255,.22);--grid:rgba(120,190,255,.10);--glow:#9fd8ff;}
      .pill{fill:var(--chip);stroke:var(--chipStroke);stroke-width:1}
      .ptxt{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'DejaVu Sans Mono',monospace;font-size:13.5px;fill:var(--ink)}
      .row{animation:scrollL linear infinite}
      .revrow{animation:scrollR linear infinite}
      @keyframes scrollL{from{transform:translateX(0)}to{transform:translateX(calc(-1 * var(--span)))}}
      @keyframes scrollR{from{transform:translateX(calc(-1 * var(--span)))}to{transform:translateX(0)}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    ]]></style>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
