<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="Open to collaborations and freelance work">
  <title>Get in touch</title>
  <defs>
    <style><![CDATA[
      svg{--bg0:#f7f9ff;--bg1:#eef2ff;--bg2:#f5f3ff;--ink:#0b1220;--muted:#4c5b7a;--c1:#0891b2;--c2:#7c3aed;--c3:#db2777;--panel:rgba(255,255,255,.82);--stroke:rgba(60,90,150,.20);--chip:rgba(60,90,150,.06);--chipStroke:rgba(60,90,150,.20);--grid:rgba(60,90,150,.10);--glow:#5b8def;}
      .t1{font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',sans-serif;font-size:26px;font-weight:700;fill:var(--ink)}
      .t2{font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',sans-serif;font-size:16px;fill:var(--muted)}
      .t3{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'DejaVu Sans Mono',monospace;font-size:14px;fill:var(--muted)}
    ]]></style>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c1)"/><stop offset=".5" stop-color="var(--c2)"/><stop offset="1" stop-color="var(--c3)"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="var(--grid)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="160" fill="var(--bg1)"/>
  <rect width="1200" height="160" fill="url(#grid)" opacity=".55"/>
  <text class="t1" x="600" y="72" text-anchor="middle">Junior Jovin — Full-Stack Engineer</text>
  <text class="t2" x="600" y="102" text-anchor="middle">open to collaborations, freelance work and open-source contributions</text>
  <text class="t3" x="600" y="128" text-anchor="middle">juniorjovin208@gmail.com</text>
  <rect x="0" y="156" width="1200" height="4" fill="url(#g1)" opacity=".9"/>
</svg>
