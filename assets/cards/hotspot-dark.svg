<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 168" width="480" height="168" role="img" aria-label="Hotspot on Linux">
  <title>Hotspot on Linux</title>
  <defs>
    <style><![CDATA[
      svg{--bg0:#04060d;--bg1:#0a1022;--bg2:#080614;--ink:#e8eefc;--muted:#8ea0c4;--c1:#22d3ee;--c2:#8b5cf6;--c3:#f472b6;--panel:rgba(12,18,36,.72);--stroke:rgba(120,190,255,.18);--chip:rgba(120,190,255,.07);--chipStroke:rgba(120,190,255,.22);--grid:rgba(120,190,255,.10);--glow:#9fd8ff;}
      .name{font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',sans-serif;font-size:21px;font-weight:700;fill:var(--ink)}
      .desc{font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',sans-serif;font-size:13.5px;fill:var(--muted)}
      .meta{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'DejaVu Sans Mono',monospace;font-size:12px;fill:var(--muted)}
      .glyph{fill:none;stroke:url(#g);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;color:var(--c2);
              animation:float 5s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      .halo{animation:halo 3.4s ease-in-out infinite}
      @keyframes halo{0%,100%{opacity:.12;transform:scale(.94)}50%{opacity:.30;transform:scale(1.06)}}
      .march{stroke:url(#g);stroke-width:2;fill:none;stroke-dasharray:150 1150;stroke-linecap:round;
              animation:march 6s linear infinite}
      @keyframes march{to{stroke-dashoffset:-1300}}
      .spark{stroke:url(#g);stroke-width:2;fill:none;stroke-dasharray:180;stroke-dashoffset:180;
              animation:draw 2.6s .3s ease-out forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
      .beam{animation:beam 6s ease-in-out infinite}
      @keyframes beam{0%{transform:translateX(-160px)}60%,100%{transform:translateX(560px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}.spark{stroke-dashoffset:0}}
    ]]></style>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="480" y2="168">
      <stop offset="0" stop-color="var(--c1)"/><stop offset=".55" stop-color="var(--c2)"/><stop offset="1" stop-color="var(--c3)"/>
    </linearGradient>
    <linearGradient id="beamg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="var(--glow)" stop-opacity=".14"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="var(--c2)" stop-opacity=".9"/><stop offset="1" stop-color="var(--c2)" stop-opacity="0"/></radialGradient>
    <clipPath id="cc"><rect x="2" y="2" width="476" height="164" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#cc)">
    <rect x="2" y="2" width="476" height="164" rx="16" fill="var(--panel)"/>
    <rect x="2" y="2" width="476" height="164" rx="16" fill="var(--bg1)" opacity=".55"/>
    <g class="beam"><rect x="-80" y="-20" width="120" height="220" fill="url(#beamg)" transform="skewX(-16)"/></g>

    <g transform="translate(410,74)">
      <circle class="halo" r="40" fill="url(#halo)"/>
      <g class="glyph"><path d="M-16 4a22 22 0 0 1 32 0" /><path d="M-9 12a12 12 0 0 1 18 0"/><circle cx="0" cy="20" r="2.6" fill="currentColor" stroke="none"/></g>
    </g>

    <text class="name" x="28" y="52">Hotspot on Linux</text>
    <path class="spark" d="M28 66 H 250" opacity=".7"/>
    <text class="desc" x="28" y="94">One Wi-Fi card as client AND access point —</text>
    <text class="desc" x="28" y="114">hostapd + dnsmasq + NAT, wired up for you.</text>

    <g transform="translate(28,138)">
      <circle cx="6" cy="-4" r="6" fill="#89e051"/>
      <text class="meta" x="20" y="0">Shell</text>
      <text class="meta" x="79" y="0">★ 2</text>
    </g>
  </g>
  <rect x="2" y="2" width="476" height="164" rx="16" fill="none" stroke="var(--stroke)" stroke-width="1.5"/>
  <rect class="march" x="2" y="2" width="476" height="164" rx="16"/>
</svg>
