<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Junior Jovin - Full-Stack Engineer, Tanzania">
  <title>Junior Jovin — Full-Stack Engineer</title>
  <defs>
    <style><![CDATA[
      svg {
        --bg0:#04060d; --bg1:#0a1022; --bg2:#080614;
        --ink:#e8eefc; --muted:#8ea0c4; --line:rgba(120,190,255,.10);
        --c1:#22d3ee; --c2:#8b5cf6; --c3:#f472b6;
        --panel:rgba(12,18,36,.72); --panelStroke:rgba(120,190,255,.18);
        --chip:rgba(120,190,255,.07); --chipStroke:rgba(120,190,255,.22);
      }
      .ink{fill:var(--ink)} .muted{fill:var(--muted)}
      .mono{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'DejaVu Sans Mono',monospace}
      .sans{font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',sans-serif}

      /* ---------- ambient ---------- */
      .blob{filter:url(#soft);opacity:.55}
      .b1{animation:drift1 18s ease-in-out infinite}
      .b2{animation:drift2 22s ease-in-out infinite}
      .b3{animation:drift3 26s ease-in-out infinite}
      @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-26px)}}
      @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,30px)}}
      @keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(34px,38px)}}

      .sweep{animation:sweep 7s linear infinite}
      @keyframes sweep{0%{transform:translateX(-520px)}100%{transform:translateX(1420px)}}

      .scan{animation:scan 9s linear infinite;opacity:.35}
      @keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(380px)}}

      .dot{animation:twinkle 4s ease-in-out infinite}
      .dot:nth-of-type(2n){animation-duration:5.5s;animation-delay:-1.2s}
      .dot:nth-of-type(3n){animation-duration:6.8s;animation-delay:-2.6s}
      @keyframes twinkle{0%,100%{opacity:.15;transform:translateY(0)}50%{opacity:.9;transform:translateY(-8px)}}

      /* ---------- name ---------- */
      .name{font-size:62px;font-weight:800;letter-spacing:2.5px;fill:url(#brand)}
      .shine{fill:#fff;opacity:.55;mix-blend-mode:overlay;animation:shine 6s ease-in-out infinite}
      @keyframes shine{0%{transform:translateX(-360px)}55%,100%{transform:translateX(760px)}}

      .rule{stroke:url(#brand);stroke-width:3;stroke-linecap:round;
            stroke-dasharray:520;stroke-dashoffset:520;animation:draw 2.4s .2s ease-out forwards}
      @keyframes draw{to{stroke-dashoffset:0}}

      /* ---------- rotating typed role ---------- */
      .role{font-size:23px;fill:var(--ink)}
      .clipbar{transform-box:fill-box;transform-origin:left center}
      .cA{animation:tA 13.5s infinite} .cB{animation:tB 13.5s infinite} .cC{animation:tC 13.5s infinite}
      @keyframes tA{0%{transform:scaleX(0);animation-timing-function:steps(19,end)}11%{transform:scaleX(1)}31%{transform:scaleX(1)}32%,100%{transform:scaleX(0)}}
      @keyframes tB{0%,33%{transform:scaleX(0);animation-timing-function:steps(21,end)}45%{transform:scaleX(1)}64%{transform:scaleX(1)}65%,100%{transform:scaleX(0)}}
      @keyframes tC{0%,66%{transform:scaleX(0);animation-timing-function:steps(23,end)}78%{transform:scaleX(1)}97%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}
      .kA{animation:kA 13.5s infinite} .kB{animation:kB 13.5s infinite} .kC{animation:kC 13.5s infinite}
      @keyframes kA{0%{transform:translateX(0);animation-timing-function:steps(19,end)}11%{transform:translateX(264px)}31%{transform:translateX(264px)}32%,100%{transform:translateX(0);opacity:0}}
      @keyframes kB{0%,33%{transform:translateX(0);opacity:0;animation-timing-function:steps(21,end)}34%{opacity:1}45%{transform:translateX(292px)}64%{transform:translateX(292px)}65%,100%{transform:translateX(0);opacity:0}}
      @keyframes kC{0%,66%{transform:translateX(0);opacity:0;animation-timing-function:steps(23,end)}67%{opacity:1}78%{transform:translateX(320px)}97%{transform:translateX(320px)}98%,100%{transform:translateX(0);opacity:0}}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.05}}

      /* ---------- chips ---------- */
      .chip{fill:var(--chip);stroke:var(--chipStroke);stroke-width:1}
      .chipwrap{opacity:0;animation:rise .7s ease-out forwards}
      .w1{animation-delay:1.5s} .w2{animation-delay:1.7s} .w3{animation-delay:1.9s}
      @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      .chiptext{font-size:14px;fill:var(--muted)}

      /* ---------- terminal ---------- */
      .panel{fill:var(--panel);stroke:var(--panelStroke);stroke-width:1.2}
      .ln{font-size:14.5px;opacity:0;animation:ln .5s ease-out forwards}
      .l1{animation-delay:.55s}.l2{animation-delay:.95s}.l3{animation-delay:1.35s}
      .l4{animation-delay:1.75s}.l5{animation-delay:2.15s}.l6{animation-delay:2.55s}.l7{animation-delay:2.95s}
      @keyframes ln{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
      .kw{fill:#c084fc}.st{fill:#5eead4}.fn{fill:#7dd3fc}.cm{fill:#5f7396}.nu{fill:#fbbf24}
      .bar{fill:url(#brand);transform-box:fill-box;transform-origin:left center;animation:fill 3.2s 2.8s ease-out forwards;transform:scaleX(0)}
      @keyframes fill{to{transform:scaleX(1)}}
      .spin{transform-origin:center;transform-box:fill-box;animation:spin 1.1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .pulse{animation:pulse 2.2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35;r:4}50%{opacity:1;r:5.5}}

      @media (prefers-reduced-motion: reduce){
        *{animation:none !important}
        .clipbar{transform:scaleX(1)} .bar{transform:scaleX(1)} .ln,.chipwrap{opacity:1}
        .cB,.cC,.kB,.kC{display:none}
      }
    ]]></style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--bg0)"/>
      <stop offset=".55" stop-color="var(--bg1)"/>
      <stop offset="1" stop-color="var(--bg2)"/>
    </linearGradient>

    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--c1)"/>
      <stop offset=".5" stop-color="var(--c2)"/>
      <stop offset="1" stop-color="var(--c3)"/>
    </linearGradient>

    <linearGradient id="sweepg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9fd8ff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="var(--line)" stroke-width="1"/>
    </pattern>

    <clipPath id="round"><rect x="0" y="0" width="1200" height="340" rx="18"/></clipPath>

    <clipPath id="rA"><rect class="clipbar cA" x="118" y="196" width="285" height="30"/></clipPath>
    <clipPath id="rB"><rect class="clipbar cB" x="118" y="196" width="315" height="30"/></clipPath>
    <clipPath id="rC"><rect class="clipbar cC" x="118" y="196" width="345" height="30"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <g class="blob b1"><circle cx="180" cy="90" r="120" fill="#22d3ee"/></g>
    <g class="blob b2"><circle cx="880" cy="270" r="150" fill="#8b5cf6"/></g>
    <g class="blob b3"><circle cx="640" cy="40" r="110" fill="#f472b6"/></g>

    <g transform="skewX(-18)"><rect class="sweep" x="-200" y="-60" width="200" height="460" fill="url(#sweepg)"/></g>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#7dd3fc" opacity=".2"/>

    <!-- particles -->
    <g fill="#9fd8ff">
      <circle class="dot" cx="92"  cy="268" r="1.8"/><circle class="dot" cx="360" cy="70"  r="1.5"/>
      <circle class="dot" cx="520" cy="250" r="2.1"/><circle class="dot" cx="700" cy="120" r="1.4"/>
      <circle class="dot" cx="1050" cy="60" r="1.9"/><circle class="dot" cx="1140" cy="300" r="1.6"/>
      <circle class="dot" cx="250" cy="300" r="1.3"/><circle class="dot" cx="470" cy="40"  r="1.7"/>
      <circle class="dot" cx="960" cy="200" r="1.4"/>
    </g>

    <!-- ============ LEFT: identity ============ -->
    <g class="mono" font-size="15">
      <text x="70" y="72" fill="var(--c1)">~/jsticks779</text>
      <text x="196" y="72" class="muted">$ whoami</text>
      <rect class="blink" x="272" y="59" width="9" height="17" fill="var(--c1)"/>
    </g>

    <g>
      <text class="sans name" x="68" y="152">JUNIOR JOVIN</text>
      <g clip-path="url(#nameclip)">
        <rect class="shine" x="-360" y="100" width="150" height="66" fill="url(#shineg)"/>
      </g>
      <clipPath id="nameclip"><text class="sans name" x="68" y="152">JUNIOR JOVIN</text></clipPath>
    </g>

    <line class="rule" x1="70" y1="172" x2="590" y2="172"/>

    <!-- rotating typed role -->
    <g class="mono role">
      <text x="70" y="216" fill="var(--c2)">&gt;</text>
      <g clip-path="url(#rA)"><text x="118" y="216">Full-Stack Engineer</text></g>
      <g clip-path="url(#rB)"><text x="118" y="216">Fintech &amp; POS Systems</text></g>
      <g clip-path="url(#rC)"><text x="118" y="216">Linux Tooling &amp; AI Apps</text></g>
      <g class="kA"><rect class="blink" x="120" y="200" width="11" height="21" fill="var(--c3)"/></g>
      <g class="kB"><rect class="blink" x="120" y="200" width="11" height="21" fill="var(--c3)"/></g>
      <g class="kC"><rect class="blink" x="120" y="200" width="11" height="21" fill="var(--c3)"/></g>
    </g>

    <!-- chips -->
    <g class="sans">
      <g class="chipwrap w1">
        <rect class="chip" x="70" y="252" width="148" height="34" rx="17"/>
        <text class="chiptext" x="90" y="274">📍 Tanzania 🇹🇿</text>
      </g>
      <g class="chipwrap w2">
        <rect class="chip" x="228" y="252" width="150" height="34" rx="17"/>
        <text class="chiptext" x="248" y="274">⚡ JOVINX TECH</text>
      </g>
      <g class="chipwrap w3">
        <rect class="chip" x="388" y="252" width="176" height="34" rx="17"/>
        <text class="chiptext" x="408" y="274">🌍 Building for Africa</text>
      </g>
    </g>

    <!-- ============ RIGHT: terminal ============ -->
    <g transform="translate(688,54)">
      <rect class="panel" x="0" y="0" width="452" height="232" rx="14"/>
      <rect x="0" y="0" width="452" height="34" rx="14" fill="rgba(255,255,255,.03)"/>
      <rect x="0" y="20" width="452" height="14" fill="rgba(255,255,255,.03)"/>
      <circle cx="22" cy="17" r="5" fill="#ff5f57"/>
      <circle cx="40" cy="17" r="5" fill="#febc2e"/>
      <circle cx="58" cy="17" r="5" fill="#28c840"/>
      <text class="mono" x="84" y="22" font-size="12" fill="var(--muted)">junior@jovinx — build.ts</text>
      <circle class="pulse" cx="430" cy="17" r="4" fill="#28c840"/>

      <g class="mono">
        <text class="ln l1" x="22" y="62"><tspan class="cm">// shipping from Dar es Salaam</tspan></text>
        <text class="ln l2" x="22" y="86"><tspan class="kw">const</tspan> <tspan class="fn">junior</tspan> = {</text>
        <text class="ln l3" x="38" y="108"><tspan class="fn">stack</tspan>: [<tspan class="st">"React"</tspan>, <tspan class="st">"Node"</tspan>, <tspan class="st">"Prisma"</tspan>],</text>
        <text class="ln l4" x="38" y="130"><tspan class="fn">focus</tspan>: <tspan class="st">"fintech · POS · AI"</tspan>,</text>
        <text class="ln l5" x="38" y="152"><tspan class="fn">shipped</tspan>: <tspan class="nu">40</tspan>+ <tspan class="cm">projects</tspan>,</text>
        <text class="ln l6" x="22" y="174">};</text>
        <text class="ln l7" x="22" y="200" fill="var(--muted)">
          <tspan fill="#28c840">✔</tspan> build ready
        </text>
      </g>

      <g transform="translate(414,196)"><g class="spin">
        <circle r="9" fill="none" stroke="rgba(125,211,252,.2)" stroke-width="2.5"/>
        <path d="M0 -9 A9 9 0 0 1 9 0" fill="none" stroke="var(--c1)" stroke-width="2.5" stroke-linecap="round"/>
      </g></g>

      <rect x="22" y="212" width="360" height="5" rx="2.5" fill="rgba(255,255,255,.07)"/>
      <rect class="bar" x="22" y="212" width="360" height="5" rx="2.5"/>
    </g>

    <!-- bottom accent -->
    <rect x="0" y="336" width="1200" height="4" fill="url(#brand)" opacity=".9"/>
    <rect class="sweep" x="-200" y="330" width="220" height="10" fill="url(#shineg)" opacity=".5"/>
    <rect x="0" y="0" width="1200" height="340" rx="18" fill="none" stroke="rgba(125,211,252,.18)" stroke-width="1.5"/>
  </g>
</svg>
