<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Junior Jovin - Full-Stack Engineer">
  <title>Junior Jovin — Full-Stack Engineer</title>
  <defs>
    <style><![CDATA[
      svg{--ink:#e6edf3;--muted:#8ea0c4;}
      .mono{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,'DejaVu Sans Mono',monospace}
      .sans{font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',sans-serif}
    ]]></style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060d"/>
      <stop offset=".55" stop-color="#0a1022"/>
      <stop offset="1" stop-color="#080614"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="rgba(120,190,255,.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <text class="sans" x="80" y="150" font-size="64" font-weight="800" letter-spacing="2" fill="url(#brand)">JUNIOR JOVIN</text>
  <text class="sans" x="80" y="200" font-size="26" fill="var(--ink)">Full-Stack Engineer</text>
  <line x1="82" y1="222" x2="352" y2="222" stroke="url(#brand)" stroke-width="3" stroke-linecap="round"/>
  <text class="mono" x="80" y="266" font-size="16" fill="var(--muted)">Fintech &middot; POS platforms &middot; Linux tooling — built end to end, shipped and maintained.</text>
  <rect x="0" y="316" width="1200" height="4" fill="url(#brand)" opacity=".9"/>
</svg>